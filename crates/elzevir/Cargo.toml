[package]
name = "elzevir"
description = "Elzevir library system: one binary with serve, import, worker and panel roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
elzevir-app.workspace = true
elzevir-domain.workspace = true
elzevir-marc.workspace = true
elzevir-store.workspace = true
elzevir-web.workspace = true
elzevir-sip2.workspace = true
elzevir-search.workspace = true
elzevir-web-templates.workspace = true
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
toml = { workspace = true, features = ["display"] }
rpassword = "7.5"
tempfile.workspace = true
thiserror.workspace = true
mimalloc.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
ureq.workspace = true
stats_alloc = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }

[dev-dependencies]
serde_json.workspace = true
http-body-util.workspace = true
tower.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }

[[bench]]
name = "opac"
harness = false

[features]
# Counts every allocation (small overhead); shown at /equipe/admin/memory.
alloc-count = ["dep:stats_alloc"]

[lints]
workspace = true
