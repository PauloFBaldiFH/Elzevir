[package]
name = "elzevir"
description = "Elzevir library system: one binary with serve, import, worker and panel roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sys-locale = "0.3.2"
semver = "1"
elzevir-app.workspace = true
elzevir-domain.workspace = true
elzevir-marc.workspace = true
elzevir-panel.workspace = true
elzevir-store.workspace = true
elzevir-web.workspace = true
elzevir-sip2.workspace = true
elzevir-search.workspace = true
elzevir-web-templates.workspace = true
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
interprocess = { version = "2.4", features = ["tokio"] }
fs4 = "0.13"
age = { version = "=0.11.5", default-features = false }
tar = "0.4"
flate2.workspace = true
zip.workspace = true
sha2 = "0.10"
base64 = "0.23"
ring = "0.17"
ipnet = "2"
cap-std = "4.0"
cap-fs-ext = "4.0"
zeroize = "1"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system", "network"] }
jiff = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
toml = { workspace = true, features = ["display"] }
rpassword = "7.5"
tempfile.workspace = true
thiserror.workspace = true
mimalloc.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
ureq.workspace = true
stats_alloc = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "sync", "io-util", "time"] }

[dev-dependencies]
elzevir-scenarios.workspace = true
http-body-util.workspace = true
tower.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
widestring = "1"
windows-service = "=0.8.1"

[[bench]]
name = "opac"
harness = false

[features]
# Counts every allocation (small overhead); shown at /equipe/admin/memory.
alloc-count = ["dep:stats_alloc"]

[lints]
workspace = true
