<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importar registros para o acervo · Elzevir</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="icon" href="/static/elzevir-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/elzevir.css">
  <script src="/static/elzevir-theme.js"></script>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/elzevir-staff.js" defer></script>
  <script src="/static/elzevir-import.js" defer></script>
</head>
<body>
  <header class="topbar staff-bar" id="staff-bar" hx-get="/equipe/barra?escopo=acervo" hx-trigger="load" hx-swap="outerHTML">
  <div class="top-row">
    <div class="brand-side">
      <span class="icon-btn" aria-hidden="true"><svg class="ico" focusable="false"><use href="/static/elzevir-icons.svg#bar-menu"></use></svg></span>
      <a class="staff-brand" href="/equipe"><img class="brand-crab" src="/static/elzevir-mark.svg" alt="" width="33" height="33">Elzevir</a>
      <span class="product-label">Área da equipe</span>
    </div>
    <nav class="top-tools"><a class="tool-link" href="/">Catálogo</a></nav>
  </div>
  <form class="search-row" action="/equipe/busca" method="get" role="search">
    <div class="search-field">
      <select class="scope-fallback" name="escopo" aria-label="Buscar em"><option value="acervo">Catálogo</option><option value="leitores">Usuários</option><option value="devolucao">Devolução</option></select>
      <input class="search-input" type="search" name="q" maxlength="200" aria-label="Termo de busca">
      <button type="submit" class="search-submit" aria-label="Buscar"><svg class="ico" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#bar-search"></use></svg></button>
    </div>
  </form>
</header>
  <main>

<section id="import-workspace" class="import-workspace" hx-history="false">
  <a href="/equipe/acervo">Acervo</a>
  <h1>Importar registros para o acervo</h1>



    <form action="/equipe/acervo/importar" method="post" enctype="multipart/form-data"
          hx-post="/equipe/acervo/importar" hx-encoding="multipart/form-data" hx-select="#import-workspace"
          hx-target="#import-workspace" hx-swap="outerHTML" hx-push-url="true" data-import-upload>
      <input type="hidden" name="csrf" value="SESSION-CSRF">

  <label for="upload-format">Formato da origem</label>
  <select id="upload-format" name="format">
    <option value="auto" selected>Detectar pelo arquivo</option>
    <option value="iso">ISO 2709</option>
    <option value="xml">MARCXML</option>
    <option value="mrk">MarcEdit</option>
  </select>

      <label for="import-file">Arquivo de origem</label>
      <input id="import-file" name="file" type="file" required aria-describedby="import-limit">
      <p id="import-limit">ISO 2709, MARCXML ou MarcEdit (.mrk), até 512 MiB e 100.000 registros.</p>
      <button type="submit">Preparar lote</button>
      <progress max="100" value="0" aria-label="Progresso do envio" hidden></progress>
    </form>



</section>

  </main>
</body>
</html>
