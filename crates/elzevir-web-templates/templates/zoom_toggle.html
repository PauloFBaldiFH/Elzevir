<button type="button" class="zoom-toggle" data-zoom-toggle aria-pressed="{% if zoom == "full" %}true{% else %}false{% endif %}" data-tip-full="{{ t.get("zoom-show-compact") }}" data-tip-compact="{{ t.get("zoom-show-full") }}" title="{% if zoom == "full" %}{{ t.get("zoom-show-compact") }}{% else %}{{ t.get("zoom-show-full") }}{% endif %}"><svg class="z-full" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#zoom-out"></use></svg><svg class="z-compact" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#zoom-in"></use></svg>{{ t.get("zoom-label") }}<kbd>Alt+Z</kbd></button>
<span class="visually-hidden" data-zoom-status aria-live="polite" data-said-full="{{ t.get("zoom-mode-full") }}" data-said-compact="{{ t.get("zoom-mode-compact") }}"></span>
