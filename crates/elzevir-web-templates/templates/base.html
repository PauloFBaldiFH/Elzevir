<!doctype html>
<html lang="{{ t.lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ t.get("app-name") }}</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="icon" href="/static/elzevir-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/elzevir.css">
  <script src="/static/elzevir-theme.js"></script>
  <script src="/static/htmx.min.js" defer></script>
  {% block shell_head %}{% endblock %}
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}<header class="topbar opac-bar">
    <div class="top-row">
      <div class="brand-side">
        <a class="brand" href="/"><img class="brand-crab" src="/static/elzevir-mark.svg" alt="" width="33" height="33">{{ t.get("app-name") }}</a>
        <span class="product-label tone-catalog">{{ t.get("opac-product") }}</span>
      </div>
      <div class="top-tools">
        <a class="icon-btn" href="/equipe" aria-label="{{ t.get("nav-to-staff") }}" title="{{ t.get("nav-to-staff") }}"><svg class="ico" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#nav-staff"></use></svg></a>
        <button type="button" class="icon-btn" data-theme-toggle hidden aria-label="{{ t.get("bar-theme") }}" title="{{ t.get("bar-theme") }}"><svg class="ico" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#bar-theme"></use></svg></button>
      </div>
    </div>
    <form class="search-row" action="/search" method="get" role="search"{% block search_hx %}{% endblock %}>
      <div class="search-field">
        <span class="active-scope tone-catalog" aria-hidden="true"><svg class="ico" focusable="false"><use href="/static/elzevir-icons.svg#bar-catalog"></use></svg><span>{{ t.get("opac-scope") }}</span></span>
        <input class="search-input" id="q" name="q" type="search" value="{% block search_value %}{% endblock %}" maxlength="256" enterkeyhint="search" placeholder="{{ t.get("opac-home-search-placeholder") }}" aria-label="{{ t.get("opac-home-search-label") }}">
        <button type="button" class="search-filter" disabled aria-label="{{ t.get("bar-advanced") }} ({{ t.get("bar-soon") }})" title="{{ t.get("bar-advanced") }} · {{ t.get("bar-soon") }}"><svg class="ico" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#bar-filter"></use></svg></button>
        <button type="submit" class="search-submit" aria-label="{{ t.get("opac-home-search-button") }}" title="{{ t.get("opac-home-search-button") }}"><svg class="ico" aria-hidden="true" focusable="false"><use href="/static/elzevir-icons.svg#bar-search"></use></svg></button>
      </div>
    </form>
  </header>{% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
