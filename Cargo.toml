[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/PauloFBaldiFH/Elzevir"
publish = false

[workspace.dependencies]
elzevir-app = { path = "crates/elzevir-app" }
elzevir-data = { path = "crates/elzevir-data" }
elzevir-domain = { path = "crates/elzevir-domain" }
elzevir-marc = { path = "crates/elzevir-marc" }
elzevir-panel = { path = "crates/elzevir-panel" }
elzevir-scenarios = { path = "crates/elzevir-scenarios" }
elzevir-search = { path = "crates/elzevir-search" }
elzevir-sip2 = { path = "crates/elzevir-sip2" }
elzevir-sources = { path = "crates/elzevir-sources" }
elzevir-store = { path = "crates/elzevir-store" }
elzevir-web = { path = "crates/elzevir-web" }
elzevir-web-templates = { path = "crates/elzevir-web-templates" }

argon2 = "0.6"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query", "json"] }
clap = { version = "4", features = ["derive"] }
calamine = { version = "=0.38.0", default-features = false }
flate2 = "1"
fluent-bundle = "0.16"
getrandom = "0.4"
mimalloc = { version = "0.1", default-features = false }
# Reader of the BIBFRAME Turtle the export writes, from Oxigraph: a W3C-conformant
# parser, so the round trip is checked by a reader that is not ours.
oxrdf = "0.3"
oxttl = { version = "0.2", default-features = false }
stats_alloc = "0.1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "stemmer"] }
http-body-util = "0.1"
# Sends the e-mail notices (docs/specs/circulacao/avisos.md): SMTP with STARTTLS or TLS by
# rustls and the system's certificates, as ureq; planned in doc 01, §5.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "rustls-native-certs"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
insta = { version = "1", default-features = false, features = ["yaml"] }
proptest = "1"
quick-xml = { version = "0.41", default-features = false }
rusqlite = { version = "0.42", features = ["bundled", "hooks", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client of `elzevir koha-codes`, the first role that reads another server. Plain
# blocking calls, TLS by rustls with the system's certificates (no bundled root list).
url = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
# Reader of `elzevir.toml`, the typed configuration of a data directory (doc 04).
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
unicode-normalization = "0.1"
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
unic-langid = { version = "0.9", features = ["macros"] }
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Production code must not abort a request (CLAUDE.md, "Erros").
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
dbg_macro = "deny"
print_stderr = "deny"
float_arithmetic = "deny"
# Every `#[allow]` / `#[expect]` must say why.
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
undocumented_unsafe_blocks = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
rc_mutex = "deny"
clone_on_ref_ptr = "deny"
self_named_module_files = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
