[package]
name = "elzevir-fuzz"
description = "Fuzz targets for Elzevir parsers (cargo-fuzz, nightly). Outside the workspace."
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
elzevir-app = { path = "../crates/elzevir-app" }
elzevir-marc = { path = "../crates/elzevir-marc" }
elzevir-sip2 = { path = "../crates/elzevir-sip2" }
elzevir-sources = { path = "../crates/elzevir-sources" }
libfuzzer-sys = "0.4"
zip = { version = "=9.6.1", default-features = false }

[[bin]]
name = "iso2709"
path = "fuzz_targets/iso2709.rs"
test = false
doc = false
bench = false

[[bin]]
name = "turtle"
path = "fuzz_targets/turtle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_detection"
path = "fuzz_targets/import_detection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "marcxml"
path = "fuzz_targets/marcxml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "marc_text"
path = "fuzz_targets/marc_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_table"
path = "fuzz_targets/import_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_koha_sql"
path = "fuzz_targets/import_koha_sql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_containers"
path = "fuzz_targets/import_containers.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: it needs the nightly toolchain.
[workspace]

[[bin]]
name = "sru_response"
path = "fuzz_targets/sru_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "z3950_pdu"
path = "fuzz_targets/z3950_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sip2"
path = "fuzz_targets/sip2.rs"
test = false
doc = false
bench = false
