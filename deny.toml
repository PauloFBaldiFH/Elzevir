# cargo-deny: licenses must be compatible with GPL-3.0-or-later, no known
# vulnerabilities, no crates from outside crates.io (CLAUDE.md, dependencies).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# age 0.11.5's translation macros read Cargo.toml/i18n.toml at build time.
# Upstream i18n-config 0.4.8 has no maintained release; these are maintenance
# advisories, not vulnerabilities. Neither parser is exposed to backup input.
# age 0.12.1 was evaluated: it adds crypto-bigint 0.5.5 (RUSTSEC-2026-0387).
# Keep the X25519 implementation without that vulnerable dependency and revisit
# when age's HPKE dependencies or i18n-config are updated. No vulnerability waived.
# ksni 0.3.7 (Linux tray) pins zbus 5, whose zvariant, zvariant_derive and zbus_names
# were folded into zbus 6: maintenance notices with no safe upgrade until ksni moves.
ignore = [
    "RUSTSEC-2026-0374",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # Typst 0.15.1 (elzevir-print, docs/specs/catalogo/etiquetas.md), its latest release,
    # accepted by Paulo on 2026-11-26. Six are maintenance notices: bincode and yaml-rust
    # (syntect), unsafe-libyaml (serde_yaml), paste (biblatex), rustybuzz and ttf-parser
    # (text shaping). The two quick-xml 0.38 advisories need untrusted XML; there
    # quick-xml only reads CSL styles, which come from the styles built into hayagriva,
    # because the print World refuses every file and the template is the library's own
    # configuration. Revisit on the next Typst release.
    "RUSTSEC-2024-0320",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0206",
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  # Public-domain dedication, GPL-compatible; used by ksni (Linux tray).
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

# interprocess transitives: reviewed LICENSE.txt files grant unrestricted use,
# modification and distribution (0BSD), compatible with GPL-3.0-or-later.
# Restrict acceptance to these exact versions; future updates require review.
[[licenses.exceptions]]
name = "recvmsg"
version = "=1.0.0"
allow = ["0BSD"]

[[licenses.exceptions]]
name = "doctest-file"
version = "=1.1.1"
allow = ["0BSD"]

# lettre's quoted-printable encoder, for the e-mail notices: 0BSD, as above.
[[licenses.exceptions]]
name = "quoted_printable"
version = "=0.5.2"
allow = ["0BSD"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
