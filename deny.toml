# cargo-deny: licenses must be compatible with GPL-3.0-or-later, no known
# vulnerabilities, no crates from outside crates.io (CLAUDE.md, dependencies).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# age 0.11.5's translation macros read Cargo.toml/i18n.toml at build time.
# Upstream i18n-config 0.4.8 has no maintained release; these are maintenance
# advisories, not vulnerabilities. Neither parser is exposed to backup input.
# age 0.12.1 was evaluated: it adds crypto-bigint 0.5.5 (RUSTSEC-2026-0387).
# Keep the X25519 implementation without that vulnerable dependency and revisit
# when age's HPKE dependencies or i18n-config are updated. No vulnerability waived.
ignore = ["RUSTSEC-2026-0374", "RUSTSEC-2026-0173"]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

# interprocess transitives: reviewed LICENSE.txt files grant unrestricted use,
# modification and distribution (0BSD), compatible with GPL-3.0-or-later.
# Restrict acceptance to these exact versions; future updates require review.
[[licenses.exceptions]]
name = "recvmsg"
version = "=1.0.0"
allow = ["0BSD"]

[[licenses.exceptions]]
name = "doctest-file"
version = "=1.1.1"
allow = ["0BSD"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
